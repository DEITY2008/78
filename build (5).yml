name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Write project files
        run: |
          mkdir -p src/main/java/com/rc/car src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "RcCar"
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
            namespace 'com.rc.car'
            compileSdk 34
            defaultConfig { applicationId 'com.rc.car'; minSdk 24; targetSdk 34; versionCode 1; versionName '1.0' }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF
          cat > src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
            <application android:label="RC 4WD" android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
              <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="sensorLandscape" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > src/main/java/com/rc/car/MainActivity.java <<'EOF'
          package com.rc.car;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import java.io.OutputStream;
          import java.util.UUID;

          public class MainActivity extends Activity {
            WebView web;
            BluetoothSocket sock;
            OutputStream out;
            static final UUID SPP = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");

            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              if (Build.VERSION.SDK_INT >= 28)
                getWindow().getAttributes().layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              web = new WebView(this);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              web.setBackgroundColor(0xFF060A14);
              web.addJavascriptInterface(new Bridge(), "Android");
              setContentView(web);
              web.loadUrl("file:///android_asset/index.html");
              if (Build.VERSION.SDK_INT >= 31 && checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED)
                requestPermissions(new String[]{Manifest.permission.BLUETOOTH_CONNECT}, 1);
            }

            @Override public void onWindowFocusChanged(boolean f) {
              super.onWindowFocusChanged(f);
              if (f) getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
            }

            void js(final String c) { runOnUiThread(() -> web.evaluateJavascript(c, null)); }

            synchronized void drop() {
              try { if (sock != null) sock.close(); } catch (Exception e) {}
              sock = null; out = null;
              js("onBt(false)");
            }

            @Override protected void onDestroy() {
              super.onDestroy();
              try { if (sock != null) sock.close(); } catch (Exception e) {}
            }

            class Bridge {
              @JavascriptInterface public String devices() {
                try {
                  StringBuilder sb = new StringBuilder();
                  for (BluetoothDevice d : BluetoothAdapter.getDefaultAdapter().getBondedDevices())
                    sb.append(d.getName()).append('|').append(d.getAddress()).append('\n');
                  return sb.toString();
                } catch (Exception e) { return ""; }
              }
              @JavascriptInterface public void connect(final String addr) {
                new Thread(() -> {
                  try {
                    BluetoothDevice d = BluetoothAdapter.getDefaultAdapter().getRemoteDevice(addr);
                    BluetoothSocket x = d.createRfcommSocketToServiceRecord(SPP);
                    x.connect();
                    sock = x; out = x.getOutputStream();
                    js("onBt(true)");
                  } catch (Exception e) { drop(); }
                }).start();
              }
              @JavascriptInterface public synchronized void send(String t) {
                try { if (out != null) { out.write(t.getBytes()); out.flush(); } } catch (Exception e) { drop(); }
              }
              @JavascriptInterface public void close() { drop(); }
            }
          }
          EOF
          cat > src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="th">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>RC 4WD Controller</title>
          <style>
          :root{--bg:#060a14;--tx:#eaf2ff;--mut:#8da2c6;--a:#37e6ff;--b:#9b6bff;--ok:#33f2a0;--bad:#ff3d6e;color-scheme:dark;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
          html{scroll-padding-top:env(safe-area-inset-top,0px)}
          html,body{height:100%;margin:0;background:var(--bg)}
          body{color:var(--tx);font:600 14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
          .bl{position:fixed;inset:0;overflow:hidden;z-index:0}
          .bl i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;animation:dr 20s ease-in-out infinite alternate}
          .bl i:nth-child(1){background:radial-gradient(#2b6bff,transparent 65%);left:-25vmax;top:-25vmax}
          .bl i:nth-child(2){background:radial-gradient(#a24bff,transparent 65%);right:-30vmax;bottom:-30vmax;animation-delay:-7s}
          .bl i:nth-child(3){background:radial-gradient(rgba(0,224,198,.5),transparent 65%);left:25%;top:35%;animation-delay:-12s}
          @keyframes dr{to{transform:translate(8vmax,6vmax) scale(1.15)}}
          @media (prefers-reduced-motion:reduce){.bl i{animation:none}}
          .g{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.05),0 18px 40px rgba(0,0,0,.35)}
          #app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:10px;padding:10px;box-sizing:border-box}
          header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;border-radius:24px}
          .br{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
          .br b{font-size:18px;letter-spacing:.12em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
          .br span{font-size:11px;color:var(--mut)}
          .br span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:6px}
          .br span.ok:before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
          button{font:inherit;color:inherit;border:0;cursor:pointer}
          .sg{display:flex;padding:3px;border-radius:16px;background:rgba(255,255,255,.08)}
          .sg button{background:none;padding:7px 14px;border-radius:13px;color:var(--mut)}
          .sg .on{background:linear-gradient(135deg,var(--a),var(--b));color:#04101f}
          .pw{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mut);min-width:130px}
          input[type=range]{width:100%;margin:0;accent-color:var(--a)}
          .pl{padding:9px 16px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22)}
          .pl.hi,.pl.on{background:linear-gradient(135deg,var(--a),var(--b));color:#04101f;border:0}
          main{flex:1;min-height:0;position:relative}
          .sc{position:absolute;inset:0;display:none;align-items:center;justify-content:space-evenly;gap:12px}
          .sc.on{display:flex}
          .pad{position:relative;aspect-ratio:1;height:min(100%,330px);max-width:46vw;border-radius:50%;touch-action:none}
          .pad:before{content:"";position:absolute;inset:17%;border-radius:50%;border:1px dashed rgba(255,255,255,.28)}
          .pad:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.16)) center/1px 70% no-repeat,linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.16)) center/70% 1px no-repeat}
          .kn{position:absolute;left:50%;top:50%;width:34%;height:34%;margin:-17% 0 0 -17%;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,var(--a) 38%,var(--b));box-shadow:0 0 28px rgba(55,230,255,.6),inset 0 2px 6px rgba(255,255,255,.7);will-change:transform;pointer-events:none;z-index:1}
          .st{width:96px;height:96px;border-radius:50%;font-weight:800;letter-spacing:.06em;color:#fff;background:radial-gradient(circle at 30% 25%,#ff9ab2,var(--bad) 55%,#a3123b);box-shadow:0 0 30px rgba(255,61,110,.55),inset 0 2px 6px rgba(255,255,255,.6);transition:transform .1s}
          .st:active{transform:scale(.92)}
          .car{position:relative;height:min(100%,260px);aspect-ratio:.7;border-radius:30px}
          .car:before{content:"";position:absolute;left:30%;right:30%;top:10px;height:5px;border-radius:5px;background:var(--a);box-shadow:0 0 12px var(--a)}
          .w{position:absolute;width:24%;height:36%;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.28);overflow:hidden}
          .w i{position:absolute;left:0;right:0;height:0;background:var(--ok);box-shadow:0 0 12px var(--ok)}
          .w:nth-child(1){left:-9%;top:7%}.w:nth-child(2){right:-9%;top:7%}.w:nth-child(3){left:-9%;bottom:7%}.w:nth-child(4){right:-9%;bottom:7%}
          .lanes{display:flex;gap:14px;height:100%;max-height:340px}
          .ln{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
          .la{position:relative;flex:1;width:68px;border-radius:34px;touch-action:none}
          .la:before{content:"";position:absolute;left:50%;top:16px;bottom:16px;width:2px;margin-left:-1px;background:rgba(255,255,255,.25)}
          .la .kn{width:52px;height:52px;margin:-26px 0 0 -26px}
          @media (orientation:portrait){
          .sc{flex-direction:column}
          .pad{height:auto;width:min(80vw,320px);max-width:none}
          .car{height:190px}
          .lanes{height:50%}
          }
          #sh,#dv{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:rgba(2,6,16,.55)}
          #sh.on,#dv.on{display:grid}
          .cd{width:min(92vw,430px);max-height:88%;overflow:auto;border-radius:28px;padding:18px;box-sizing:border-box}
          .cd h3{margin:0 0 4px;font-size:17px}
          .cd p{margin:0 0 10px;font-size:12px;color:var(--mut);font-weight:500}
          .rw{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(255,255,255,.12)}
          .rw b{flex:1}
          .hz{position:relative;width:min(46vw,360px);height:68px;border-radius:34px;touch-action:none}.hz:before{content:"";position:absolute;top:50%;left:16px;right:16px;height:2px;margin-top:-1px;background:rgba(255,255,255,.25)}.hz .kn{width:52px;height:52px;margin:-26px 0 0 -26px}
          </style>
          </head>
          <body>
          <div class="bl"><i></i><i></i><i></i></div>
          <div id="app">
          <header class="g">
            <div class="br"><b>RC·4WD</b><span id="ss">ยังไม่เชื่อมต่อ</span></div>
            <div class="sg" id="sg"><button data-m="joy">จอย</button><button class="on" data-m="dul">คันเร่ง</button><button data-m="whl">รายล้อ</button></div>
            <div class="pw"><span>กำลังสูงสุด <b id="pv"></b></span><input id="pw" type="range" min="20" max="100"></div>
            <button class="pl" id="cg" aria-label="ตั้งค่า">⚙</button>
            <button class="pl hi" id="cn">เชื่อมต่อ</button>
          </header>
          <main>
            <section class="sc" id="joy">
              <button class="st">STOP</button>
              <div class="car g"><div class="w"><i></i></div><div class="w"><i></i></div><div class="w"><i></i></div><div class="w"><i></i></div></div>
              <div class="pad g" id="pd"><div class="kn"></div></div>
            </section>
            <section class="sc on" id="dul">
              <div class="lanes"><div class="ln"><div class="la g" id="th"><div class="kn"></div></div>คันเร่ง / ถอย</div></div>
              <button class="st">STOP</button>
              <div class="ln"><div class="hz g" id="sr"><div class="kn"></div></div>เลี้ยวซ้าย / ขวา</div>
            </section>
            <section class="sc" id="whl">
              <div class="lanes">
                <div class="ln"><div class="la g" data-i="0"><div class="kn"></div></div>M1 หน้าซ้าย</div>
                <div class="ln"><div class="la g" data-i="2"><div class="kn"></div></div>M3 หลังซ้าย</div>
                <div class="ln"><div class="la g" data-i="1"><div class="kn"></div></div>M2 หน้าขวา</div>
                <div class="ln"><div class="la g" data-i="3"><div class="kn"></div></div>M4 หลังขวา</div>
              </div>
              <button class="st">STOP</button>
            </section>
          </main>
          </div>
          <div id="sh"><div class="cd g">
            <h3>ตั้งค่าทิศมอเตอร์</h3>
            <p>ยกรถให้ล้อลอย กด “ทดสอบ” ทีละล้อ ถ้าล้อหมุนถอยหลังให้กด “กลับทิศ” ระบบจำค่าให้อัตโนมัติ</p>
            <div id="rw"></div>
            <button class="pl hi" id="xs" style="width:100%;margin-top:12px">เสร็จสิ้น</button>
          </div></div>
          <div id="dv"><div class="cd g"><h3>เลือกบอร์ดที่จับคู่ไว้</h3><p>ถ้าไม่เห็น RC-Car ให้จับคู่ในหน้า Bluetooth ของมือถือก่อน</p><div id="dl"></div><button class="pl" id="dx" style="width:100%;margin-top:12px">ปิด</button></div></div>
          <script>
          const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
          const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
          const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
          const NUS='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RXU='6e400002-b5a3-f393-e0a9-e50e24dcca9e';
          let dev,ch,busy=0,mode='dul',P=ld('lim',70),lim=P/100,inv=ld('inv',[0,1,1,0]),J=[0,0],W=[0,0,0,0],T=[0,0,0,0],tu=0;
          const A=window.Android||{devices:()=>'',connect(){},send(){},close(){}};
          const dz=v=>Math.abs(v)<.08?0:v;
          function pad(el,kn,cb,one){
            let id=null;
            const R=()=>one==1?el.clientHeight/2-30:one==2?el.clientWidth/2-30:el.clientWidth/2*.62;
            const set=(x,y)=>{kn.style.transform=`translate(${x*R()}px,${-y*R()}px)`;cb(x,y)};
            const mv=e=>{const b=el.getBoundingClientRect(),r=R();let x=one==1?0:(e.clientX-b.left-b.width/2)/r,y=one==2?0:-(e.clientY-b.top-b.height/2)/r;const d=Math.hypot(x,y);if(d>1){x/=d;y/=d}set(x,y)};
            el.onpointerdown=e=>{id=e.pointerId;el.setPointerCapture(id);kn.style.transition='none';mv(e);navigator.vibrate&&navigator.vibrate(8)};
            el.onpointermove=e=>{if(e.pointerId===id)mv(e)};
            el.onpointerup=el.onpointercancel=e=>{if(e.pointerId!==id)return;id=null;kn.style.transition='transform .28s cubic-bezier(.3,1.6,.5,1)';set(0,0)};
          }
          pad($('#pd'),$('#pd .kn'),(x,y)=>{J=[dz(x),dz(y)]});
          $$('.la[data-i]').forEach(l=>pad(l,l.querySelector('.kn'),(x,y)=>{W[+l.dataset.i]=dz(y)},1));
          pad($('#th'),$('#th .kn'),(x,y)=>{J[1]=dz(y)},1);
          pad($('#sr'),$('#sr .kn'),(x,y)=>{J[0]=dz(x)},2);
          function tg(){
            if(Date.now()<tu)return T;
            if(mode=='whl')return W;
            const[x,y]=J;let l=y+x,r=y-x,m=Math.max(1,Math.abs(l),Math.abs(r));l/=m;r/=m;return[l,r,l,r];
          }
          function show(t){$$('.w i').forEach((e,i)=>{const v=t[i]*lim;e.style.height=Math.abs(v)*50+'%';e.style.top=v<0?'50%':'auto';e.style.bottom=v>=0?'50%':'auto';e.style.background=v<0?'var(--bad)':'var(--ok)'})}
          function tx(){
            const t=tg();show(t);
            if(ch)A.send('D,'+t.map(v=>Math.round(v*lim*100)).join(',')+'\n');
          }
          setInterval(tx,70);
          function stop(){J=[0,0];W=[0,0,0,0];tu=0;$$('.kn').forEach(k=>{k.style.transition='transform .25s';k.style.transform='none'})}
          $$('.st').forEach(b=>b.onpointerdown=()=>{stop();navigator.vibrate&&navigator.vibrate(40)});
          document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
          $('#sg').onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;stop();$$('#sg button').forEach(b=>b.classList.toggle('on',b==e.target));$$('.sc').forEach(s=>s.classList.toggle('on',s.id==m))};
          $('#pw').value=P;$('#pv').textContent=P+'%';
          $('#pw').oninput=e=>{P=+e.target.value;lim=P/100;$('#pv').textContent=P+'%';sv('lim',P)};
          function ui(on){
            const s=$('#ss');s.className=on?'ok':'';s.textContent=on?'เชื่อมต่อแล้ว · '+(dev.name||'RC-Car'):'ยังไม่เชื่อมต่อ';
            const b=$('#cn');b.textContent=on?'ตัดการเชื่อมต่อ':'เชื่อมต่อ';b.classList.toggle('hi',!on);
          }
          const sendN=()=>A.send('N,'+inv.join(',')+'\n');
          $('#cn').onclick=()=>{
            if(ch){A.close();return}
            const l=A.devices().split('\n').filter(Boolean);
            $('#dl').innerHTML=l.length?l.map(x=>{const[n,a]=x.split('|');return `<div class="rw"><b>${n}</b><button class="pl hi" data-a="${a}" data-n="${n}">เชื่อมต่อ</button></div>`}).join(''):'<p>ยังไม่พบอุปกรณ์ที่จับคู่ หรือยังไม่ได้อนุญาต Bluetooth</p>';
            $('#dv').classList.add('on');
          };
          $('#dl').onclick=e=>{const d=e.target.dataset;if(!d.a)return;$('#dv').classList.remove('on');$('#ss').textContent='กำลังเชื่อมต่อ…';dev={name:d.n};A.connect(d.a)};
          $('#dx').onclick=()=>$('#dv').classList.remove('on');
          window.onBt=ok=>{ch=!!ok;if(ok)sendN();else stop();ui(ok)};
          const N=['M1 หน้าซ้าย','M2 หน้าขวา','M3 หลังซ้าย','M4 หลังขวา'];
          function rows(){$('#rw').innerHTML=N.map((n,i)=>`<div class="rw"><b>${n}</b><button class="pl" data-t="${i}">ทดสอบ</button><button class="pl ${inv[i]?'on':''}" data-v="${i}">กลับทิศ</button></div>`).join('')}
          $('#rw').onclick=e=>{
            const d=e.target.dataset;
            if(d.t!=null){T=[0,0,0,0];T[+d.t]=Math.min(1,.45/lim);tu=Date.now()+900}
            if(d.v!=null){inv[+d.v]^=1;sv('inv',inv);rows();ch&&sendN()}
          };
          $('#cg').onclick=()=>{rows();$('#sh').classList.add('on')};
          $('#xs').onclick=()=>$('#sh').classList.remove('on');
          </script>
          </body>
          </html>
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RC-Car-APK
          path: build/outputs/apk/debug/*.apk
